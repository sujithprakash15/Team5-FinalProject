<h2>Register New User</h2>
<form #registerform="ngForm">
    UserName: <input type="text" [(ngModel)]="user.username" name="user.username"/><br />
    Password: <input type="password" [(ngModel)]="user.userPassword" name="user.userPassword"/><br />
    <input type="button" value="submit" (click)="register()">
 
</form>
<p style="color: red;"{{errMsg}} ></p>
