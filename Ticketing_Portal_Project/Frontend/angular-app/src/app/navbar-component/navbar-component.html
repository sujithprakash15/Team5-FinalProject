<nav class="main-nav">
    @if(username) {
        <div class="nav-container">
            <div class="nav-links">

                <!-- COMMON FOR ALL -->
                <a routerLink="/home"
                   routerLinkActive="active"
                   [routerLinkActiveOptions]="{ exact: true }">
                   🏠 Home
                </a>

                <a routerLink="/ticket"
                   routerLinkActive="active">
                   🎫 Ticket
                </a>

                <a routerLink="/ticketreply"
                   routerLinkActive="active">
                   💬 Ticket Reply
                </a>

                <!-- ADMIN ONLY -->
                @if(isAdmin) {

                    <a routerLink="/employee"
                       routerLinkActive="active">
                       👥 Employee
                    </a>

                    <a routerLink="/department"
                       routerLinkActive="active">
                       🏢 Department
                    </a>

                    <a routerLink="/tickettype"
                       routerLinkActive="active">
                       📋 Ticket Type
                    </a>

                    <a routerLink="/sla"
                       routerLinkActive="active">
                       ⏱️ SLA
                    </a>
                }

                <a routerLink="/logout"
                   routerLinkActive="active">
                   🚪 Logout
                </a>

            </div>

            <div class="user-info">
                <span class="welcome-text">Welcome,</span>
                <span class="username">{{ username }}</span>
            </div>
        </div>
    }

    @else {
        <div class="nav-container">
            <div class="nav-links">

                <a routerLink="/"
                   routerLinkActive="active"
                   [routerLinkActiveOptions]="{ exact: true }">
                   🏠 Home
                </a>

                <a routerLink="/login"
                   routerLinkActive="active">
                   🔑 Login
                </a>

                <a routerLink="/register"
                   routerLinkActive="active">
                   📝 Register
                </a>

            </div>
        </div>
    }
</nav>
