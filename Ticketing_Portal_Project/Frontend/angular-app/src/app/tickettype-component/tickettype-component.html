<div class="tickettype-container">
  <!-- Form Section -->
  <section class="form-section">
    <form class="tickettype-form" #ticketTypeForm="ngForm">
      <div class="form-group">
        <label for="ticketTypeId" class="form-label required">Ticket Type ID</label>
        <input
          type="text"
          id="ticketTypeId"
          [(ngModel)]="ticketType.ticketTypeId"
          name="ticketTypeId"
          class="form-input"
          placeholder="Enter ticket type ID (e.g., TT01)"
          maxlength="4" />
      </div>

      <div class="form-group">
        <label for="typeName" class="form-label required">Type Name</label>
        <input
          type="text"
          id="typeName"
          [(ngModel)]="ticketType.typeName"
          name="typeName"
          class="form-input"
          placeholder="Enter type name"
          maxlength="30" />
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Description</label>
        <textarea
          id="description"
          [(ngModel)]="ticketType.description"
          name="description"
          class="form-textarea"
          placeholder="Enter ticket type description"
          rows="3"
          maxlength="100"></textarea>
      </div>

      <div class="form-group">
        <label for="slaId" class="form-label required">SLA</label>
        <select
          id="slaId"
          [(ngModel)]="ticketType.slaId"
          name="slaId"
          class="form-input"
          required>
          <option value="">Select an SLA</option>
          <option *ngFor="let sla of slas" [value]="sla.slaId">
            {{ sla.slaId }} - {{ sla.slaName }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="deptId" class="form-label required">Department</label>
        <select
          id="deptId"
          [(ngModel)]="ticketType.deptId"
          name="deptId"
          class="form-input"
          required>
          <option value="">Select a department</option>
          <option *ngFor="let dept of departments" [value]="dept.deptId">
            {{ dept.deptId }} - {{ dept.deptName }}
          </option>
        </select>
      </div>
    </form>

    <!-- Actions -->
    <div class="form-actions">
      <button
        type="button"
        (click)="saveTicketType()"
        class="action-btn add-btn">
        Add Ticket Type
      </button>

      <button
        type="button"
        (click)="getTicketType()"
        class="action-btn show-btn">
        Show
      </button>

      <button
        type="button"
        (click)="updateTicketType()"
        class="action-btn update-btn">
        Update
      </button>

      <button
        type="button"
        (click)="deleteTicketType()"
        class="action-btn delete-btn">
        Delete
      </button>

    </div>

    <!-- Error -->
    <div *ngIf="errMsg" class="error-container">
      <div class="error-message">
        {{ errMsg }}
      </div>
    </div>
  </section>

  <!-- Table Section -->
  <section class="table-section">
    <div class="table-header">
      <div class="table-icon">📋</div>
      <div>
        <h2 class="table-title">Ticket Types List</h2>
        <p class="table-subtitle">All available ticket types</p>
      </div>
    </div>

    <div *ngIf="ticketTypes.length === 0" class="empty-state">
      <div class="empty-icon">📭</div>
      <p class="empty-text">
        No ticket types available. Add your first ticket type to get started.
      </p>
    </div>

    <div *ngIf="ticketTypes.length > 0" class="tickettypes-table-container">
      <table class="tickettypes-table">
        <thead>
          <tr>
            <th>Ticket Type ID</th>
            <th>Type Name</th>
            <th>Description</th>
            <th>SLA ID</th>
            <th>Department ID</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let tt of ticketTypes">
            <td class="tickettype-id">{{ tt.ticketTypeId }}</td>
            <td class="type-name">{{ tt.typeName }}</td>
            <td>{{ tt.description }}</td>
            <td class="sla-id">{{ tt.slaId }}</td>
            <td class="dept-id">{{ tt.deptId }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
