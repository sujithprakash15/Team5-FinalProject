<h2>Ticket Management</h2>

<!-- ERROR MESSAGE -->
<div style="color:red" *ngIf="errMsg">
  {{ errMsg }}
</div>

<hr />

<!-- TICKET FORM -->
<div class="ticket-form">

  <label>Ticket ID</label>
  <input type="text" [(ngModel)]="ticket.ticketId" />

  <label>Title</label>
  <input type="text" [(ngModel)]="ticket.title" />

  <label>Description</label>
  <textarea [(ngModel)]="ticket.description"></textarea>

  <label>Ticket Type ID</label>
  <input type="text" [(ngModel)]="ticket.ticketTypeId" />

  <label>Status</label>
  <select [(ngModel)]="ticket.status">
    <option>Open</option>
    <option>In Progress</option>
    <option>Closed</option>
  </select>

  <label>Created By Employee ID</label>
  <input type="text" [(ngModel)]="ticket.createdByEmpId" />

  <label>Assigned To Employee ID</label>
  <input type="text" [(ngModel)]="ticket.assignedToEmpId" />

  <br /><br />

  <button (click)="addTicket()">Raise Ticket</button>
  <button (click)="showTicket()">Search</button>
  <button (click)="updateTicket()">Update</button>
  <button (click)="deleteTicket()">Delete</button>

</div>

<hr />

<!-- TICKET LIST -->
<h3>All Tickets</h3>

<table border="1" width="100%">
  <tr>
    <th>Ticket ID</th>
    <th>Title</th>
    <th>Description</th>
    <th>Type</th>
    <th>Status</th>
    <th>Created By</th>
    <th>Assigned To</th>
    <th>Created Date</th>
  </tr>

  <tr *ngFor="let t of tickets">
    <td>{{ t.ticketId }}</td>
    <td>{{ t.title }}</td>
    <td>{{ t.description }}</td>
    <td>{{ t.ticketTypeId }}</td>
    <td>{{ t.status }}</td>
    <td>{{ t.createdByEmpId }}</td>
    <td>{{ t.assignedToEmpId }}</td>
    <td>{{ t.ticketCreatedDate | date:'short' }}</td>
  </tr>
</table>
