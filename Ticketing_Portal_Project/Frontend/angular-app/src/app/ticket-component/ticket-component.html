<div class="ticket-container">

  <section class="form-section">
    <form class="ticket-form" #ticketForm="ngForm">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label required">Ticket ID</label>
          <input class="form-input"
                 [(ngModel)]="ticket.ticketId"
                 name="ticketId">
        </div>

        <div class="form-group">
          <label class="form-label required">Title</label>
          <input class="form-input"
                 [(ngModel)]="ticket.title"
                 name="title"
                 required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label required">Description</label>
        <input class="form-input"
               [(ngModel)]="ticket.description"
               name="description"
               required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label required">Ticket Type</label>
          <select class="form-input"
                  [(ngModel)]="ticket.ticketTypeId"
                  name="ticketTypeId"
                  required>
            <option value="" disabled>Select Ticket Type</option>
            <option *ngFor="let type of ticketTypes"
                    [value]="type.ticketTypeId || type.id">
              {{ type.ticketTypeId || type.id }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label required">Status</label>
          <select class="form-input"
                  [(ngModel)]="ticket.status"
                  name="status">
            <option>Open</option>
            <option>In Progress</option>
            <option>Resolved</option>
            <option>Closed</option>
          </select>
        </div>
      </div>

      <div class="form-row">

        <div class="form-group" *ngIf="role === 'ADMIN'">
          <label class="form-label required">Created By</label>
          <select class="form-input"
                  [(ngModel)]="ticket.createdByEmpId"
                  name="createdByEmpId">
            <option *ngFor="let emp of employees"
                    [value]="emp.empId">
              {{ emp.empName }} ({{ emp.empId }})
            </option>
          </select>
        </div>

        <div class="form-group" *ngIf="role !== 'ADMIN'">
          <label class="form-label required">Created By</label>
          <input class="form-input"
                 [value]="loggedEmpId"
                 disabled>
        </div>

        <div class="form-group" *ngIf="role === 'ADMIN'">
          <label class="form-label">Assigned To</label>
          <select class="form-input"
                  [(ngModel)]="ticket.assignedToEmpId"
                  name="assignedToEmpId">
            <option value="">Not Assigned</option>
            <option *ngFor="let emp of employees"
                    [value]="emp.empId">
              {{ emp.empName }} ({{ emp.empId }})
            </option>
          </select>
        </div>

      </div>

    </form>

    <div class="form-actions">
      <button class="action-btn add-btn"
              (click)="addTicket()">
        Add Ticket
      </button>

      <button class="action-btn update-btn"
              *ngIf="role === 'ADMIN'"
              (click)="updateTicket()">
        Update
      </button>

      <button class="action-btn show-btn"
              (click)="showTicket()">
        Show Ticket
      </button>

      <button class="action-btn delete-btn"
              *ngIf="role === 'ADMIN'"
              (click)="deleteTicket()">
        Delete
      </button>
    </div>

    <div *ngIf="errMsg" class="error-container">
      <div class="error-message">{{ errMsg }}</div>
    </div>

  </section>

  <div *ngIf="role !== 'ADMIN'" class="view-toggle">
  <button class="toggle-btn" 
          [class.active]="viewMode === 'created'"
          (click)="switchView('created')">
    🗂 My Created Tickets
  </button>
  <button class="toggle-btn"
          [class.active]="viewMode === 'assigned'"
          (click)="switchView('assigned')">
    📋 Tickets Assigned to Me
  </button>
</div>

  <section class="filters-section">

    <h3>🔍 Filter Tickets</h3>

    <div class="filters-row">

      <div class="filter-box">
        <label>Status</label>
        <select class="form-input"
                [(ngModel)]="selectedStatus"
                (change)="filterByStatus()">
          <option value="">All</option>
          <option>Open</option>
          <option>In Progress</option>
          <option>Resolved</option>
          <option>Closed</option>
        </select>
      </div>

      <div class="filter-box">
        <label>Ticket Type</label>
        <select class="form-input"
                [(ngModel)]="filterTicketType"
                (change)="filterByTicketType()">
          <option value="">All</option>
          <option *ngFor="let type of ticketTypes"
                  [value]="type.ticketTypeId || type.id">
            {{ type.ticketTypeId || type.id }}
          </option>
        </select>
      </div>

      <div class="filter-box">
        <button class="action-btn clear-btn"
                (click)="clearFilters()">
          Clear
        </button>
      </div>

    </div>

  </section>

  <section class="table-section">

    <div *ngIf="tickets.length === 0" class="empty-state">
      <div class="empty-icon">📭</div>
      <p>No tickets available</p>
    </div>

    <div class="tickets-grid" *ngIf="tickets.length > 0">

      <div class="ticket-card" *ngFor="let t of tickets">

        <div class="ticket-header">
          <span class="ticket-id">#{{ t.ticketId }}</span>
          <span class="ticket-status"
                [class]="'status-' + t.status.toLowerCase().replace(' ','-')">
            {{ t.status }}
          </span>
        </div>

        <div class="ticket-body">
          <p><strong>Title:</strong> {{ t.title }}</p>
          <p><strong>Description:</strong> {{ t.description }}</p>
          <p><strong>Type:</strong> {{ t.ticketTypeId }}</p>
          <p><strong>Created By:</strong> {{ t.createdByEmpId }}</p>
          <p><strong>Assigned To:</strong>
            {{ t.assignedToEmpId ? t.assignedToEmpId : 'Not Assigned' }}
          </p>
        </div>

      </div>

    </div>

  </section>

</div>
